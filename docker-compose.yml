version: '3.8'

services:
  liverpool-stats:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_FOOTBALL_API_KEY=${VITE_FOOTBALL_API_KEY}
    container_name: liverpool-stats
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Development container with hot reload
  liverpool-stats-dev:
    image: node:20-alpine
    container_name: liverpool-stats-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_FOOTBALL_API_KEY=${VITE_FOOTBALL_API_KEY}
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev
